# FlashLiquidator Lab — simulation-only research platform. No service holds keys or can broadcast transactions.
name: flashliquidator-lab

x-backend: &backend
  build: ./backend
  env_file: .env
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [internal]
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 1g }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flashliquidator
      POSTGRES_USER: fll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fll -d flashliquidator"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped
    networks: [internal]
    deploy: { resources: { limits: { cpus: "1.0", memory: 1g } } }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }
    restart: unless-stopped
    networks: [internal]

  anvil:
    # Isolated fork simulator. Not published on any host port; reachable only as http://anvil:8545 inside the network.
    image: ${ANVIL_IMAGE:-ghcr.io/foundry-rs/foundry:v1.0.0}
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--silent", "--steps-tracing"]
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}' http://127.0.0.1:8545 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { cpus: "2.0", memory: 2g } } }

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    networks: [internal, egress]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  indexer:
    <<: *backend
    networks: [internal, egress]
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "-Q", "indexer", "-n", "indexer@%h", "--concurrency=2", "--loglevel=INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    networks: [internal, egress]
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "-Q", "celery,simulation", "-n", "worker@%h", "--concurrency=${SIMULATION_CONCURRENCY:-2}", "--loglevel=INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      anvil: { condition: service_started }

  scheduler:
    <<: *backend
    networks: [internal, egress]
    command: ["celery", "-A", "app.workers.celery_app:celery", "beat", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    # Bound to localhost only. Public access goes through the `caddy` service (profile `edge`): TLS + basic auth.
    ports: ["${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"]
    depends_on: [api]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    networks: [internal]
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m } } }

  caddy:
    # Optional public edge: automatic HTTPS for PUBLIC_HOSTNAME, basic auth in front of the whole dashboard.
    # Enable with: docker compose --profile edge up -d
    image: caddy:2-alpine
    profiles: [edge]
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME for the caddy profile}
      EDGE_BASICAUTH_USER: ${EDGE_BASICAUTH_USER:-admin}
      EDGE_BASICAUTH_HASH: ${EDGE_BASICAUTH_HASH:?set EDGE_BASICAUTH_HASH (bcrypt) for the caddy profile}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports: ["80:80", "443:443"]
    depends_on: [frontend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [internal, egress]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  internal:
    internal: true   # no route to the outside: postgres, redis and anvil live only here
  egress:            # outbound internet (RPC providers, ACME) for api, workers and caddy; nothing listens publicly on it
