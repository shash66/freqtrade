[project]
name = "flashliquidator-lab-backend"
version = "0.1.0"
description = "Self-hosted Aave V3 liquidation research and simulation platform (simulation only, no live execution)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115,<0.116",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "celery>=5.4",
  "web3==7.6.0",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "passlib>=1.7",
  "bcrypt>=4.0,<5",
  "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
